version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: aegisguard-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aegisguard-backend
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - USE_REDIS=true
      - LAB_SIMULATION_MODE=true
    ports:
      - "5000:5000"
    depends_on:
      - redis
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aegisguard-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  redis-data:
